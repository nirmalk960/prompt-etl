name: Publish single image

# Builds and pushes the multi-arch single image to the GitHub Container Registry
# (GHCR). The image inherits the repository's visibility, so a private repo
# produces a private package by default.
#   - push a tag like v0.1.0  -> publishes :0.1.0, :0.1, :latest
#   - manual run (workflow_dispatch) -> publishes :latest (and optional input tag)
#
# No extra secrets are required: the built-in GITHUB_TOKEN authenticates to GHCR.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version tag (e.g. 0.1.0). Always also tags latest."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Docker tags
        id: tags
        run: |
          # ghcr.io/<owner>/<repo>, lowercased for registry compatibility
          REPO="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          TAGS="$REPO:latest"
          V="${{ steps.meta.outputs.version }}"
          if [ -n "$V" ]; then
            TAGS="$TAGS,$REPO:$V,$REPO:${V%.*}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.allinone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
