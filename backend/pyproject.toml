[project]
name = "prompt-etl"
version = "0.1.0"
description = "Server-deployed multi-tenant ETL platform with NL pipeline builder and tiered compute engines."
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "MIT" }

dependencies = [
    # web
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.17",
    "sse-starlette>=2.1.3",

    # config / validation
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",

    # db
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",

    # queue + cache
    "redis[hiredis]>=5.2,<6.0",
    "arq>=0.26,<1.0",

    # object storage
    "boto3>=1.35,<2.0",
    "botocore>=1.35,<2.0",

    # engines
    "pandas>=2.2,<3.0",
    "polars>=1.13,<2.0",
    "duckdb>=1.1.3,<2.0",
    "pyarrow>=18.0,<19.0",
    "openpyxl>=3.1.5",

    # llm
    "httpx>=0.27,<1.0",

    # misc
    "structlog>=24.4,<25.0",
    "tenacity>=9.0,<10.0",
    "anyio>=4.6,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prompt_etl*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR2004"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
