apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prompt-etl-meg.fullname" . }}-worker
  labels:
    {{- include "prompt-etl-meg.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "prompt-etl-meg.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "prompt-etl-meg.name" . }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.worker.repository }}:{{ .Values.image.worker.tag }}"
          imagePullPolicy: {{ .Values.image.worker.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.postgres.external.url | default "postgresql+asyncpg://prompt_etl:prompt_etl@postgres:5432/prompt_etl" | quote }}
            - name: REDIS_URL
              value: {{ .Values.redis.external.url | default "redis://redis:6379/0" | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ .Values.objectStore.s3.endpointUrl | quote }}
            - name: S3_PUBLIC_ENDPOINT_URL
              value: {{ .Values.objectStore.s3.publicEndpointUrl | quote }}
            - name: S3_REGION
              value: {{ .Values.objectStore.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prompt-etl-meg.fullname" . }}-secrets
                  key: s3AccessKey
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prompt-etl-meg.fullname" . }}-secrets
                  key: s3SecretKey
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
