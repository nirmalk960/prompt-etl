apiVersion: v1
kind: Service
metadata:
  name: {{ include "prompt-etl.fullname" . }}-api
  labels:
    {{- include "prompt-etl.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: {{ include "prompt-etl.name" . }}
    app.kubernetes.io/component: api
