apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prompt-etl.fullname" . }}-secrets
  labels:
    {{- include "prompt-etl.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3AccessKey: {{ .Values.objectStore.s3.accessKey | quote }}
  s3SecretKey: {{ .Values.objectStore.s3.secretKey | quote }}
