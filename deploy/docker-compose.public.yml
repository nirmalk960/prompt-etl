# Turnkey run for end users of the published image.
# The image is private on GHCR, so first: docker login ghcr.io (read:packages).
#   docker compose -f docker-compose.public.yml up -d
#   open http://localhost:8080
services:
  prompt-etl:
    image: ghcr.io/nirmalk960/prompt-etl:latest
    container_name: prompt-etl
    ports:
      - "8080:8080"
    volumes:
      - prompt-etl-data:/data
    # Required on Linux so the container can reach a host-installed Ollama.
    # No-op on Docker Desktop (Mac/Windows).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Point at host Ollama; app falls back to deterministic codegen if absent.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5-coder:7b
    restart: unless-stopped

volumes:
  prompt-etl-data:
